name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SITE_URL: https://docops.agentra.io.vn
  # ID giả để e2e kiểm tra được cổng đồng ý cookie; production lấy ID thật từ Vercel.
  NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: true }
      # Lighthouse chấm canonical theo domain đang chạy → build lại với URL localhost trước khi đo
      - run: pnpm build
        env: { NEXT_PUBLIC_SITE_URL: 'http://localhost:3200' }
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
